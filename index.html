<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>できたよ！シール帳</title>
<meta name="theme-color" content="#FF8FB8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="できたよ！">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --berry:#E8447A;
  --berry-deep:#B82B5C;
  --pink:#FF8FB8;
  --blush:#FFE3EE;
  --lilac:#EBE3FF;
  --sun:#FFD23F;
  --mint:#4ED1B0;
  --sky:#5AB0FF;
  --plum:#3B2548;
  --plum-soft:#7A6585;
  --white:#fff;
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body);font-weight:500;color:var(--plum);line-height:1.6;
  background-color:#FFF3F8;
  background-image:
    radial-gradient(circle at 20px 20px,#FFD3E5 3px,transparent 3.5px),
    radial-gradient(circle at 50px 50px,#E3D8FF 3px,transparent 3.5px);
  background-size:60px 60px;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 56px}

/* ––––– header ––––– */
.top{text-align:center;margin:6px 0 16px}
.top h1{
font-family:var(–display);font-weight:400;font-size:26px;margin:0;color:var(–berry);
letter-spacing:.04em;
text-shadow:2px 2px 0 #fff,3px 3px 0 var(–blush);
}
.top p{margin:2px 0 0;font-size:13px;color:var(–plum-soft)}

/* ––––– counter ––––– */
.sheet{
position:relative;background:var(–white);border-radius:26px;padding:16px 18px 14px;margin-bottom:18px;
border:3px solid var(–pink);box-shadow:0 6px 0 var(–pink);
}
.sheet .tag{
position:absolute;top:-14px;left:18px;background:var(–sun);color:var(–plum);
font-size:13px;font-weight:700;padding:3px 14px;border-radius:999px;
transform:rotate(-3deg);border:2px solid #fff;box-shadow:0 2px 0 rgba(59,37,72,.15);
}
.count{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}
.count .num{font-family:var(–display);font-size:58px;line-height:1;color:var(–berry);text-shadow:3px 3px 0 var(–blush)}
.count .unit{font-size:17px;font-weight:700}
.sheet .sub{font-size:13px;color:var(–plum-soft);margin-top:4px}
.minirow{display:flex;gap:2px;flex-wrap:wrap;margin-top:8px;min-height:22px}
.minirow svg{width:22px;height:22px;filter:drop-shadow(0 1px 0 rgba(59,37,72,.2))}

/* ––––– month nav ––––– */
.nav{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;gap:8px}
.nav h2{margin:0;font-family:var(–display);font-weight:400;font-size:20px;color:var(–plum)}
.rbtn{
width:46px;height:46px;border-radius:50%;border:3px solid var(–pink);background:#fff;color:var(–berry);
font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(–pink);font-family:inherit;
}
.rbtn:active{transform:translateY(3px);box-shadow:none}
.tobtn{
font:inherit;font-weight:700;font-size:13px;border:none;background:var(–lilac);color:var(–plum);
border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px;
}

/* ––––– calendar ––––– */
.cal{
background:#fff;border-radius:26px;border:3px solid var(–lilac);box-shadow:0 6px 0 var(–lilac);
padding:10px 6px 12px;
}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;font-weight:700;color:var(–plum-soft);padding:2px 0 4px}
.wd.sun{color:#E0566B}.wd.sat{color:#3F7BD6}
.cell{
min-height:68px;border-radius:14px;border:2px solid transparent;background:#FFF8FB;
padding:3px 1px;cursor:pointer;font:inherit;color:inherit;
display:flex;flex-direction:column;align-items:center;gap:1px;
}
.cell.blank{visibility:hidden;cursor:default}
.cell .d{font-size:12px;font-weight:700;line-height:1;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cell.today{border:2px dashed var(–berry);background:#FFEEF5}
.cell.today .d{background:var(–berry);color:#fff}
.cell.sel{border:2px solid var(–berry);background:var(–blush)}
.stk{display:flex;flex-wrap:wrap;justify-content:center;max-width:100%;padding:0 1px}
.stk svg{width:15px;height:15px;margin:0 -0.5px;filter:drop-shadow(0 1px 0 rgba(59,37,72,.22))}
.more{font-size:10px;color:var(–plum-soft);font-weight:700}

/* ––––– day panel ––––– */
.panel{
background:#fff;border-radius:26px;border:3px solid var(–pink);box-shadow:0 6px 0 var(–pink);
padding:16px 14px 18px;margin-top:20px;
}
.panel h3{margin:0 0 10px;font-family:var(–display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-family:var(–body);font-weight:700;font-size:12px;background:var(–berry);color:#fff;border-radius:999px;padding:1px 10px}
.empty{color:var(–plum-soft);font-size:14px;margin:4px 0 12px}
.items{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#FFF3F8;border-radius:16px;padding:8px 6px 8px 10px}
.item svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 1px 0 rgba(59,37,72,.22))}
.item .t{flex:1;font-size:15px;word-break:break-word}
.del{width:42px;height:42px;border:none;background:transparent;color:var(–plum-soft);font-size:20px;cursor:pointer;border-radius:50%;flex:none}
.inputrow{display:flex;gap:8px}
input[type=text],textarea{
flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:16px;
border:3px solid var(–lilac);background:#fff;color:var(–plum);
}
.add{
font:inherit;font-weight:700;font-size:15px;border:none;border-radius:16px;
background:var(–berry);color:#fff;padding:0 16px;cursor:pointer;min-height:50px;
box-shadow:0 4px 0 var(–berry-deep);white-space:nowrap;
}
.add:active{transform:translateY(4px);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{
font:inherit;font-size:13px;font-weight:700;border:2px solid var(–lilac);background:#fff;color:var(–plum);
border-radius:999px;padding:6px 12px;cursor:pointer;min-height:38px;
}
.chip:active{background:var(–lilac)}

button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
outline:3px solid var(–sky);outline-offset:2px;
}

/* ––––– list / backup ––––– */
details{margin-top:18px;background:#fff;border-radius:22px;border:3px solid var(–lilac);padding:2px 14px}
summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:15px}
.mlist{padding:0 0 12px}
.mlist .day{font-size:13px;color:var(–plum-soft);margin:10px 0 4px;font-weight:700}
.mlist .e{display:flex;align-items:center;gap:8px;font-size:14px;padding:2px 0}
.mlist .e svg{width:20px;height:20px;flex:none}
.bk p{font-size:13px;color:var(–plum-soft);margin:0 0 10px}
.bk .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bk textarea{width:100%;min-height:80px;font-size:14px;border-radius:14px}
.sbtn{font:inherit;font-weight:700;font-size:14px;border:2px solid var(–pink);background:#fff;color:var(–berry);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:42px}
.msg{font-size:13px;color:var(–berry);min-height:20px;margin-top:6px}

/* ––––– reward ––––– */
.overlay{
position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
background:rgba(59,37,72,.38);padding:20px;
}
.overlay.on{display:flex}
.reward{
background:#fff;border-radius:32px;border:4px solid var(–pink);box-shadow:0 8px 0 var(–pink);
padding:26px 22px 20px;text-align:center;max-width:340px;width:100%;
animation:rwpop .5s cubic-bezier(.3,1.7,.5,1);
}
.reward .big svg{width:96px;height:96px;filter:drop-shadow(0 3px 0 rgba(59,37,72,.2));animation:wob 1.2s ease-in-out .4s 2}
.reward .cm{font-family:var(–display);font-size:25px;line-height:1.35;color:var(–berry);margin:8px 0 6px;text-shadow:2px 2px 0 var(–blush)}
.reward .sm{font-size:14px;color:var(–plum);margin:0 0 4px;word-break:break-word}
.reward .ct{font-size:13px;color:var(–plum-soft);margin:0 0 14px}
.reward .ok{
font:inherit;font-weight:700;font-size:16px;border:none;border-radius:999px;background:var(–berry);color:#fff;
padding:12px 30px;cursor:pointer;box-shadow:0 4px 0 var(–berry-deep);min-height:48px;
}
.reward .ok:active{transform:translateY(4px);box-shadow:none}
@keyframes rwpop{0%{transform:scale(.6) translateY(30px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}}
.pop{animation:stpop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes stpop{0%{transform:scale(.1) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.foot{text-align:center;font-size:12px;color:var(–plum-soft);margin-top:22px}

@media (prefers-reduced-motion:reduce){
.reward,.reward .big svg,.pop{animation:none}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>できたよ！シール帳</h1>
    <p>今日のできたこと、1つずつ貼っていこう</p>
  </header>

  <section class="sheet" aria-live="polite">
    <span class="tag" id="tag">今月</span>
    <div class="count"><span class="num" id="mNum">0</span><span class="unit">こ できた！</span></div>
    <div class="sub" id="mSub"></div>
    <div class="minirow" id="mini" aria-hidden="true"></div>
  </section>

  <div class="nav">
    <button class="rbtn" id="prev" aria-label="前の月">◀</button>
    <h2 id="monthTitle"></h2>
    <button class="rbtn" id="next" aria-label="次の月">▶</button>
  </div>
  <div style="text-align:center;margin:-2px 0 10px"><button class="tobtn" id="toToday">きょうにもどる</button></div>

  <div class="cal"><div class="grid" id="grid"></div></div>

  <section class="panel" id="panel"></section>

  <details>
    <summary>この月のできたこと一覧</summary>
    <div class="mlist" id="mlist"></div>
  </details>

  <details>
    <summary>記録のバックアップ</summary>
    <div class="bk" style="padding-bottom:12px">
      <p>記録はこの端末のブラウザに保存されます。ブラウザのデータを消すと記録も消えるので、ときどき「コピー」して、メモなどに貼っておくと安心です。</p>
      <div class="btns">
        <button class="sbtn" id="bkCopy">記録をコピー</button>
        <button class="sbtn" id="bkLoad">貼りつけた記録を読み込む</button>
      </div>
      <textarea id="bkText" placeholder="読み込むときは、コピーした記録をここに貼りつけます" aria-label="バックアップ用テキスト"></textarea>
      <div class="msg" id="bkMsg" role="status"></div>
    </div>
  </details>

  <div class="foot" id="foot">毎日1つでも、ぜんぶ数えるよ</div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="ごほうび">
  <div class="reward" id="reward"></div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const COLORS=['#FF6F91','#FFC93C','#3FC1A5','#4FA3F7','#9B7BE8','#FF9F5A'];
const SHAPES=['star','heart','flower','dot','sparkle','cloud'];
const SUGGEST=['朝おきた','ごはんを作った','仕事に行った','「ありがとう」を言えた','ちょっと休めた','だれかの役に立てた'];
const WD=['日','月','火','水','木','金','土'];
const KEY='dekita-sticker-book-v1';

const BIG=['がんばったね！','すごいね！','すてき！','えらい！','ナイス〜！','さすがだね！','よくできました！','かっこいい！','やったね！','いいね、いいね！'];
const SMALL=[
  'ちゃんとできてるよ',
  'その1つが、ちゃんと大きな1つだよ',
  'だれかの役に立ってるよ',
  '今日の自分に、ぱちぱち👏',
  'できたこと、ちゃんと残ったよ',
  '気づけたこと自体がすてき',
  'いつも本当によくやってるね',
  'やってること、ちゃんと価値があるよ',
  'あなたのがんばり、見えてるよ',
  'えらいえらい。ひと休みもしてね'
];
const MILE={
  1:{b:'1つめ、ゲット！',s:'今日のスタート、すてき✨'},
  3:{b:'3つもできた！',s:'ほら、できてるじゃない！'},
  5:{b:'5つ！すごい！',s:'今日はキラキラの日だね'},
  7:{b:'7つも！？',s:'今日の自分、ほめまくっていいよ'},
  10:{b:'10こ達成！🎉',s:'もう、殿堂入りだね'}
};

let entries={};
let memoryOnly=false;
const today=new Date();
const todayKey=keyOf(today.getFullYear(),today.getMonth(),today.getDate());
let viewY=today.getFullYear(), viewM=today.getMonth();
let selected=todayKey;
let lastAddedId=null;
let lastBig=-1,lastSmall=-1;
let closeTimer=null;

function pad(n){return String(n).padStart(2,'0')}
function keyOf(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hash(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0}return Math.abs(h)}
function pick(arr,avoid){let i;do{i=Math.floor(Math.random()*arr.length)}while(arr.length>1&&i===avoid);return i}

/* ---------- storage ---------- */
let storeMode='none';
async function load(){
  // 1) Claude内のアーティファクト用の保存機能  2) ふつうのブラウザの保存機能
  try{
    if(window.storage&&window.storage.get){
      let r=null;
      try{r=await window.storage.get(KEY)}catch(e){r=null}
      storeMode='claude';
      if(r&&r.value){entries=JSON.parse(r.value)||{};return}
    }
  }catch(e){}
  try{
    const raw=localStorage.getItem(KEY);
    if(storeMode==='none') storeMode='browser';
    if(raw) entries=JSON.parse(raw)||{};
  }catch(e){}
}
async function save(){
  let ok=false;
  try{
    if(window.storage&&window.storage.set){
      const r=await window.storage.set(KEY,JSON.stringify(entries));
      if(r) ok=true;
    }
  }catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(entries));ok=true}catch(e){}
  storeMode=ok?(storeMode==='none'?'browser':storeMode):'none';
  renderFoot();
}
function renderFoot(){
  const f=document.getElementById('foot');
  f.textContent=storeMode==='none'
    ?'このページでは記録が保存されないかもしれません。「記録のバックアップ」でコピーしておくと安心です。'
    :'毎日1つでも、ぜんぶ数えるよ';
}

/* ---------- stickers ---------- */
function sticker(s,rot){
  const c=COLORS[s.c%COLORS.length];
  const st='fill="'+c+'" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"';
  let b='';
  switch(s.s){
    case 'star': b='<path '+st+' d="M12 2.5l2.8 6 6.6.8-4.9 4.5 1.3 6.5L12 17.1 6.2 20.3l1.3-6.5L2.6 9.3l6.6-.8z"/>';break;
    case 'heart': b='<path '+st+' d="M12 20.5s-7.8-4.7-9.6-9.4C1 7.6 3.3 4.5 6.5 4.5c2 0 3.6 1 5.5 3.1 1.9-2.1 3.5-3.1 5.5-3.1 3.2 0 5.5 3.1 4.1 6.6-1.8 4.7-9.6 9.4-9.6 9.4z"/>';break;
    case 'dot': b='<circle '+st+' cx="12" cy="12" r="9"/><circle cx="9" cy="9" r="2.6" fill="#fff" fill-opacity=".6"/>';break;
    case 'sparkle': b='<path '+st+' d="M12 1.8c.9 5.4 4.8 9.3 10.2 10.2-5.4.9-9.3 4.8-10.2 10.2C11.1 17 7.2 13.1 1.8 12 7.2 11.1 11.1 7.2 12 1.8z"/>';break;
    case 'cloud': b='<path '+st+' d="M7.2 19a4.7 4.7 0 0 1-.7-9.3A6 6 0 0 1 17.8 8.6 5 5 0 0 1 17.2 19z"/>';break;
    default:{
      let p='';
      for(let i=0;i<5;i++){const a=i*72*Math.PI/180-Math.PI/2;
        p+='<circle '+st+' cx="'+(12+5.2*Math.cos(a)).toFixed(2)+'" cy="'+(12+5.2*Math.sin(a)).toFixed(2)+'" r="4.4"/>';}
      b=p+'<circle cx="12" cy="12" r="3.3" fill="#FFF6C9"/>';
    }
  }
  const style=rot?' style="transform:rotate('+rot+'deg)"':'';
  return '<svg viewBox="0 0 24 24" aria-hidden="true"'+style+'>'+b+'</svg>';
}
function rotOf(e){return (hash(e.id)%41)-20}

/* ---------- counts ---------- */
function monthStats(y,m){
  let n=0,days=0;const pre=y+'-'+pad(m+1)+'-';
  for(const k in entries){if(k.startsWith(pre)&&entries[k].length){n+=entries[k].length;days++}}
  return {n,days};
}
function allCount(){let n=0;for(const k in entries)n+=entries[k].length;return n}

/* ---------- render ---------- */
function renderTotal(){
  const ms=monthStats(viewY,viewM);
  document.getElementById('tag').textContent=(viewM+1)+'月のできた';
  document.getElementById('mNum').textContent=ms.n;
  document.getElementById('mSub').textContent=
    (ms.days?ms.days+'日にシールを貼ったよ。':'まだ空っぽ。1つ目を貼ってみよう。')+' これまでの合計 '+allCount()+'こ';
  const pre=viewY+'-'+pad(viewM+1)+'-';
  const all=[];
  Object.keys(entries).filter(k=>k.startsWith(pre)).sort().forEach(k=>entries[k].forEach(e=>all.push(e)));
  const last=all.slice(-14);
  document.getElementById('mini').innerHTML=last.map(e=>sticker(e,rotOf(e))).join('');
}
function renderCal(){
  document.getElementById('monthTitle').textContent=viewY+'年'+(viewM+1)+'月';
  const first=new Date(viewY,viewM,1).getDay();
  const dim=new Date(viewY,viewM+1,0).getDate();
  let h='';
  WD.forEach((w,i)=>{h+='<div class="wd'+(i===0?' sun':i===6?' sat':'')+'">'+w+'</div>'});
  for(let i=0;i<first;i++)h+='<div class="cell blank"></div>';
  for(let d=1;d<=dim;d++){
    const k=keyOf(viewY,viewM,d);
    const list=entries[k]||[];
    const shown=list.slice(0,6).map(e=>sticker(e,rotOf(e))).join('');
    const extra=list.length>6?'<span class="more">+'+(list.length-6)+'</span>':'';
    h+='<button class="cell'+(k===todayKey?' today':'')+(k===selected?' sel':'')+'" data-k="'+k+'" aria-label="'+(viewM+1)+'月'+d+'日 '+list.length+'こ">'+
       '<span class="d">'+d+'</span><span class="stk">'+shown+'</span>'+extra+'</button>';
  }
  document.getElementById('grid').innerHTML=h;
}
function renderPanel(keepFocus){
  const [y,m,d]=selected.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const list=entries[selected]||[];
  let h='<h3>'+m+'月'+d+'日（'+WD[dt.getDay()]+'）'+(selected===todayKey?'<span class="badge">きょう</span>':'')+'</h3>';
  if(list.length){
    h+='<ul class="items">'+list.map(e=>
      '<li class="item"><span class="'+(e.id===lastAddedId?'pop':'')+'" style="display:flex">'+sticker(e,rotOf(e))+'</span>'+
      '<span class="t">'+esc(e.t)+'</span>'+
      '<button class="del" data-id="'+e.id+'" aria-label="「'+esc(e.t)+'」を削除">×</button></li>').join('')+'</ul>';
  }else{
    h+='<p class="empty">この日にできたことを書いてみよう。小さなことでだいじょうぶ！</p>';
  }
  h+='<div class="inputrow"><input type="text" id="txt" maxlength="60" placeholder="できたこと" aria-label="できたこと"><button class="add" id="add">シールを貼る</button></div>';
  h+='<div class="chips">'+SUGGEST.map(s=>'<button class="chip" data-s="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div>';
  document.getElementById('panel').innerHTML=h;
  lastAddedId=null;
}
function renderList(){
  const pre=viewY+'-'+pad(viewM+1)+'-';
  const keys=Object.keys(entries).filter(k=>k.startsWith(pre)&&entries[k].length).sort().reverse();
  let h=keys.length?'':'<p class="empty">この月はまだありません。</p>';
  keys.forEach(k=>{
    h+='<div class="day">'+(viewM+1)+'月'+Number(k.slice(8))+'日</div>'+
       entries[k].map(e=>'<div class="e">'+sticker(e,0)+'<span>'+esc(e.t)+'</span></div>').join('');
  });
  document.getElementById('mlist').innerHTML=h;
}
function renderAll(){renderTotal();renderCal();renderPanel();renderList()}

/* ---------- reward ---------- */
function showReward(entry,count){
  let big,small;
  if(MILE[count]){big=MILE[count].b;small=MILE[count].s}
  else{
    lastBig=pick(BIG,lastBig);lastSmall=pick(SMALL,lastSmall);
    big=BIG[lastBig];small=SMALL[lastSmall];
  }
  const r=document.getElementById('reward');
  r.innerHTML='<div class="big">'+sticker(entry,0)+'</div>'+
    '<div class="cm">'+esc(big)+'</div>'+
    '<p class="sm">「'+esc(entry.t)+'」</p>'+
    '<p class="sm">'+esc(small)+'</p>'+
    '<p class="ct">'+(selected===todayKey?'今日':'この日')+'は '+count+'こ目のシール</p>'+
    '<button class="ok" id="okBtn">ありがとう</button>';
  document.getElementById('overlay').classList.add('on');
  document.getElementById('okBtn').focus({preventScroll:true});
  confetti(count>=3?150:90);
  clearTimeout(closeTimer);
  closeTimer=setTimeout(closeReward,6000);
}
function closeReward(){
  clearTimeout(closeTimer);
  document.getElementById('overlay').classList.remove('on');
  const t=document.getElementById('txt'); if(t) t.focus({preventScroll:true});
}

/* ---------- confetti ---------- */
function confetti(n){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const ps=[];
  for(let i=0;i<n;i++){
    ps.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*0.45,
      vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,
      w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:COLORS[i%COLORS.length],round:Math.random()<.4});
  }
  const t0=performance.now();
  (function tick(now){
    const t=now-t0;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{
      p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      ctx.globalAlpha=Math.max(0,1-t/2200);
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.w/2,0,7);ctx.fill()}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(t<2200) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ---------- actions ---------- */
function addEntry(text){
  text=text.trim();
  if(!text) return;
  const e={id:'e'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),t:text,
    s:SHAPES[Math.floor(Math.random()*SHAPES.length)],c:Math.floor(Math.random()*COLORS.length)};
  (entries[selected]=entries[selected]||[]).push(e);
  lastAddedId=e.id;
  save();renderAll();
  showReward(e,entries[selected].length);
}

document.addEventListener('click',ev=>{
  if(ev.target.id==='overlay'){closeReward();return}
  const t=ev.target.closest('button'); if(!t) return;
  if(t.id==='okBtn') closeReward();
  else if(t.id==='prev'){viewM--;if(viewM<0){viewM=11;viewY--}renderTotal();renderCal();renderList()}
  else if(t.id==='next'){viewM++;if(viewM>11){viewM=0;viewY++}renderTotal();renderCal();renderList()}
  else if(t.id==='toToday'){viewY=today.getFullYear();viewM=today.getMonth();selected=todayKey;renderAll()}
  else if(t.classList.contains('cell')&&t.dataset.k){selected=t.dataset.k;renderCal();renderPanel()}
  else if(t.id==='add'){addEntry(document.getElementById('txt').value)}
  else if(t.classList.contains('chip')){addEntry(t.dataset.s)}
  else if(t.classList.contains('del')){
    entries[selected]=(entries[selected]||[]).filter(e=>e.id!==t.dataset.id);
    if(!entries[selected].length) delete entries[selected];
    save();renderAll();
  }
  else if(t.id==='bkCopy'){
    const txt=JSON.stringify(entries);
    const area=document.getElementById('bkText');
    const done=()=>{document.getElementById('bkMsg').textContent='コピーしました。メモなどに貼って保管してね。'};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>{area.value=txt;area.select();document.getElementById('bkMsg').textContent='下の文字をコピーしてください。'})}
    else{area.value=txt;area.select();document.getElementById('bkMsg').textContent='下の文字をコピーしてください。'}
  }
  else if(t.id==='bkLoad'){
    const v=document.getElementById('bkText').value.trim();
    try{
      const obj=JSON.parse(v);
      if(typeof obj!=='object'||Array.isArray(obj)||obj===null) throw 0;
      for(const k in obj){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(obj[k])) throw 0;
        obj[k].forEach(e=>{if(!e||typeof e.t!=='string'||!e.id) throw 0});
      }
      entries=obj;save();renderAll();
      document.getElementById('bkMsg').textContent='読み込みました。';
    }catch(e){document.getElementById('bkMsg').textContent='読み込めませんでした。コピーした記録をそのまま貼ってね。'}
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.id==='txt'&&!ev.isComposing) addEntry(ev.target.value);
  if(ev.key==='Escape') closeReward();
});

/* ---------- home-screen icon ---------- */
function makeIcon(){
  try{
    const c=document.createElement('canvas');c.width=c.height=180;
    const x=c.getContext('2d');
    x.fillStyle='#FF8FB8';x.fillRect(0,0,180,180);
    x.fillStyle='#FFF6C9';x.strokeStyle='#fff';x.lineWidth=8;x.lineJoin='round';
    x.beginPath();
    for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?32:70;
      const px=90+r*Math.cos(a),py=96+r*Math.sin(a);i?x.lineTo(px,py):x.moveTo(px,py)}
    x.closePath();x.fillStyle='#FFD23F';x.fill();x.stroke();
    document.getElementById('touchIcon').href=c.toDataURL('image/png');
  }catch(e){}
}

makeIcon();renderAll();load().then(()=>{renderAll();renderFoot()});
</script>
